<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="hook" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f58a4b"/><stop offset="1" stop-color="#e2621c"/></linearGradient>
<linearGradient id="final" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9a4a"/><stop offset="1" stop-color="#2b7a35"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.25"/></filter>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d32f2f"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<ellipse cx="160" cy="55" rx="80" ry="24" fill="#111" filter="url(#shadow)"/>
<text x="160" y="59.9" font-size="15" text-anchor="middle" font-weight="normal" fill="#fff">Action</text>
<polyline points="160,79 160,111" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="70.0" y="112.0" width="180" height="46" rx="4" fill="url(#hook)" stroke="#c4520f" filter="url(#shadow)"/>
<text x="160" y="133.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#fff">pre()</text>
<text x="160" y="147.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">prepare, validate, gather data</text>
<polyline points="160,158 160,198" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="70.0" y="199.0" width="180" height="52" rx="4" fill="url(#hook)" stroke="#c4520f" filter="url(#shadow)"/>
<text x="160" y="223.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#fff">child selection</text>
<text x="160" y="237.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">LLM picks the next actions</text>
<polyline points="160,251 160,306" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#a-ink)"/>
<text x="168" y="284" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1b1b1b">nothing selected</text>
<rect x="70.0" y="307.0" width="180" height="46" rx="4" fill="url(#hook)" stroke="#c4520f" filter="url(#shadow)"/>
<text x="160" y="328.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#fff">fallback()</text>
<text x="160" y="342.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">handle a plain-text answer</text>
<polyline points="160,353 160,406" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="70.0" y="407.0" width="180" height="46" rx="4" fill="url(#hook)" stroke="#c4520f" filter="url(#shadow)"/>
<text x="160" y="428.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#fff">post()</text>
<text x="160" y="442.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">consolidate, persist</text>
<polyline points="160,453 160,494" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="70.0" y="495.0" width="180" height="50" rx="4" fill="url(#final)" stroke="#1f6e2a" filter="url(#shadow)"/>
<text x="160" y="518.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#fff">cleanup()</text>
<text x="160" y="533.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#fff">always runs</text>
<polyline points="160,545 160,578" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#a-ink)"/>
<ellipse cx="160" cy="602" rx="95" ry="24" fill="#111" filter="url(#shadow)"/>
<text x="160" y="606.9" font-size="15" text-anchor="middle" font-weight="normal" fill="#fff">back to parent</text>
<rect x="390" y="175" width="420" height="125" rx="10" fill="#fafbfc" stroke="#9aa3ad" stroke-width="1.5"/>
<text x="600" y="199" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b1b1b">run the selected children</text>
<text x="600" y="217" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#555">one by one, or together when marked __concurrent__</text>
<ellipse cx="490" cy="260" rx="48" ry="21" fill="#111" filter="url(#shadow)"/>
<text x="490" y="264.2" font-size="13" text-anchor="middle" font-weight="normal" fill="#fff">Child 1</text>
<ellipse cx="600" cy="260" rx="48" ry="21" fill="#111" filter="url(#shadow)"/>
<text x="600" y="264.2" font-size="13" text-anchor="middle" font-weight="normal" fill="#fff">Child 2</text>
<ellipse cx="710" cy="260" rx="48" ry="21" fill="#111" filter="url(#shadow)"/>
<text x="710" y="264.2" font-size="13" text-anchor="middle" font-weight="normal" fill="#fff">Child 3</text>
<polyline points="250,225 388,225" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#a-ink)"/>
<text x="338" y="217" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1b1b1b">selected</text>
<polyline points="600,175 600,55 242,55" fill="none" stroke="#7a7a7a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-gray)"/>
<text x="420" y="47" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" font-style="italic">each child runs this same lifecycle</text>
<polyline points="600,300 600,380 162,380" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<polyline points="160,380 45,380 45,225 68,225" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#a-ink)"/>
<text x="37" y="302" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1b1b1b" transform="rotate(-90 37 302)">repeat (__max_iteration__)</text>
<polyline points="250,135 300,135" fill="none" stroke="#d32f2f" stroke-width="1.8"/>
<polyline points="250,330 300,330" fill="none" stroke="#d32f2f" stroke-width="1.8"/>
<polyline points="250,430 300,430" fill="none" stroke="#d32f2f" stroke-width="1.8"/>
<polyline points="300,135 300,520 252,520" fill="none" stroke="#d32f2f" stroke-width="1.8" marker-end="url(#a-red)"/>
<text x="314" y="462" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#d32f2f" transform="rotate(-90 314 462)">END / BREAK / STOP or an error</text>
<rect x="390" y="440" width="420" height="185" rx="10" fill="#fafbfc" stroke="#d9dde3"/>
<text x="410" y="466" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1b">What a hook can return</text>
<text x="410" y="494" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1b1b1b">None</text>
<text x="478" y="494" font-size="12.5" text-anchor="start" font-weight="normal" fill="#333">keep going</text>
<text x="410" y="518" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1b1b1b">END</text>
<text x="478" y="518" font-size="12.5" text-anchor="start" font-weight="normal" fill="#333">stop this action; siblings continue</text>
<text x="410" y="542" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1b1b1b">BREAK</text>
<text x="478" y="542" font-size="12.5" text-anchor="start" font-weight="normal" fill="#333">stop, and exit the nearest __max_iteration__ loop</text>
<text x="410" y="566" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1b1b1b">STOP</text>
<text x="478" y="566" font-size="12.5" text-anchor="start" font-weight="normal" fill="#333">stop the whole agent</text>
<text x="410" y="600" font-size="11.5" text-anchor="start" font-weight="normal" fill="#555" font-style="italic">Errors go to on_error(). Full flow: action-life-cycle-detailed.svg</text>
</svg>
